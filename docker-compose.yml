version: '3.9'
services:
  insurance_db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: plmoknijb09
      MYSQL_DATABASE: insurance_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    restart: always

  backend:
    build: .
    container_name: spring_backend
    depends_on:
      - insurance_db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3
      SPRING_DATASOURCE_USERNAME: bP76JuA9u3FnEYp.root
      SPRING_DATASOURCE_PASSWORD: VNwsFBtsYmMcgk8d
    ports:
      - "8080:8080"
    restart: always

volumes:
  mysql_data:
