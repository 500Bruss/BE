name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Khởi tạo MySQL Container
    services:
      mysql_db: # Đây là id của service
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: plmoknijb09
          MYSQL_DATABASE: insurance_db
        ports:
          - 3306:3306 # Map port 3306 của container ra 3306 của máy ảo CI
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: >
          mvn clean verify 
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/insurance_db 
          -Dspring.datasource.username=root 
          -Dspring.datasource.password=plmoknijb09