name: Java CI with Maven

# Kích hoạt workflow khi có push hoặc pull request vào nhánh main
on:
  push:
    branches:
      - main  # Có thể thay đổi theo nhánh bạn muốn
  pull_request:
    branches:
      - main  # Kích hoạt cho các pull request vào nhánh main

jobs:
  build:
    runs-on: ubuntu-latest  # Chạy trên môi trường Ubuntu

    steps:
      # Step 1: Checkout mã nguồn từ GitHub
      - name: Checkout code
        uses: actions/checkout@v2 # Sử dụng action để checkout mã nguồn từ repository

      # Step 2: Set up Java (JDK 17, bạn có thể thay đổi nếu cần)
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Cài đặt phụ thuộc Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository  # Lưu cache để tránh tải lại phụ thuộc mỗi lần
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}  # Key để kiểm tra cache
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: Build dự án và chạy các unit tests
      - name: Build with Maven
        run: mvn clean install -DskipTests=false  # -DskipTests=false để chạy unit tests

      # Step 5: Kiểm tra kết quả unit test
      - name: Run tests with Maven
        run: mvn test  # Chạy các unit tests của dự án
