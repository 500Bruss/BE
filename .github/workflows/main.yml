name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Sử dụng v4 để nhanh và bảo mật hơn
      - name: Checkout code
        uses: actions/checkout@v4

      # Tích hợp sẵn cache maven vào đây, xóa bỏ bước cache thủ công bên dưới
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Chỉ cần một lệnh duy nhất để build và chạy test
      # 'verify' bao gồm cả 'test' và 'package', sạch sẽ và tối ưu hơn
      - name: Build and Test with Maven
        run: mvn clean verify